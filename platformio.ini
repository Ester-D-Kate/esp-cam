; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = usb_vga30

[env:esp32cam]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
; Camera, HTTP, MQTT and JSON use the matching ESP-IDF/Arduino SDK.
monitor_speed = 115200
; Use a conservative rate for ESP32-CAM USB/serial adapters and jumper wiring.
upload_speed = 115200
build_src_filter = +<*> -<usb_cam/>

[usb_camera]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<usb_cam/>
build_flags = -Ishared

[env:usb_vga30]
extends = usb_camera
build_flags = ${usb_camera.build_flags} -DUSB_CAM_PROFILE=1

[env:usb_svga15]
extends = usb_camera
build_flags = ${usb_camera.build_flags} -DUSB_CAM_PROFILE=2

[env:usb_hd10]
extends = usb_camera
build_flags = ${usb_camera.build_flags} -DUSB_CAM_PROFILE=3

[env:usb_qvga30]
extends = usb_camera
build_flags = ${usb_camera.build_flags} -DUSB_CAM_PROFILE=4
