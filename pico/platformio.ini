[platformio]
default_envs = zero_camera

[env]
; Native Pico SDK support in this pinned community PlatformIO platform.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = picosdk
; The platform default GCC 9 package is Intel-only on macOS. GCC 14 includes
; native Apple Silicon and current Linux toolchains in the PlatformIO registry.
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
board = waveshare_rp2040_zero
upload_protocol = picotool
monitor_speed = 115200
extra_scripts =
    pre:scripts/tinyusb_paths.py
    post:scripts/tinyusb_build.py
build_flags =
    -I../shared
    -Isrc
    -DPIO_STDIO_NONE
    -DCFG_TUSB_MCU=OPT_MCU_RP2040
    -DCFG_TUSB_OS=OPT_OS_NONE
    -DPICO_RP2040_USB_DEVICE_UFRAME_FIX=1
    -DPICO_RP2040_USB_DEVICE_ENUMERATION_FIX=1
    -DPICO_STACK_SIZE=4096
    -DPICO_CORE1_STACK_SIZE=4096

[env:zero_camera]

[env:pico_camera]
board = pico

; Candidate high-rate menu for measurement; ESP already accepts these requests.
[env:zero_camera_fast]
build_flags = ${env.build_flags} -DUSB_CAM_ENABLE_60FPS=1
